<!doctype html>
<html lang="en-us">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dorm Room Summer2025-Spring2026</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
      }

      #unity-canvas {
        display: block;
        background: #231f20;
      }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" width="1920" height="1080" tabindex="-1"></canvas>
    <script src="Build/dormroom.loader.js"></script>
    <script>
      var canvas = document.querySelector("#unity-canvas");

      function resizeCanvasToViewport() {
        var viewportWidth = window.innerWidth;
        var viewportHeight = window.innerHeight;
        var targetAspect = 16 / 9;

        var fittedWidth = viewportWidth;
        var fittedHeight = viewportWidth / targetAspect;

        if (fittedHeight > viewportHeight) {
          fittedHeight = viewportHeight;
          fittedWidth = viewportHeight * targetAspect;
        }

        canvas.style.width = `${Math.round(fittedWidth)}px`;
        canvas.style.height = `${Math.round(fittedHeight)}px`;
      }

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        // Mobile device style: fill the whole browser client area with the game canvas:
        var meta = document.createElement("meta");
        meta.name = "viewport";
        meta.content =
          "width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes";
        document.getElementsByTagName("head")[0].appendChild(meta);

        canvas.style.width = "100vw";
        canvas.style.height = "100vh";
        canvas.style.maxWidth = "100vw";
        canvas.style.maxHeight = "100vh";

        document.body.style.textAlign = "left";
      } else {
        resizeCanvasToViewport();
        window.addEventListener("resize", resizeCanvasToViewport);
      }

      createUnityInstance(document.querySelector("#unity-canvas"), {
        arguments: [],
        dataUrl: "Build/dormroom.data.unityweb",
        frameworkUrl: "Build/dormroom.framework.js.unityweb",
        codeUrl: "Build/dormroom.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "GN",
        productName: "My project (1)",
        productVersion: "0.1.0",
        // matchWebGLToCanvasSize: false, // Uncomment this to separately control WebGL canvas render size and DOM element size.
        // devicePixelRatio: 1, // Uncomment this to override low DPI rendering on high DPI displays.
      })
        .then((unityInstance) => {})
        .catch((message) => {
          alert(message);
        });
    </script>
  </body>
</html>
