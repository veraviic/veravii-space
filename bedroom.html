<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bedroom</title>
    <link rel="stylesheet" href="bedroom.css" />
  </head>
  <body>
    <main class="links">
      <section class="panel">
        <button
          class="panel-btn"
          type="button"
          data-target="archive.html"
          data-go-label="Go to the archive"
          data-title="Archive Page"
          data-desc="This opens up my archive of living and moving since relocating to Calgary..."
        >
          <img src="broom-archive.jpeg" alt="Archive Bedroom View" />
        </button>
      </section>
      <section class="panel panel--unity">
        <button
          class="panel-btn"
          type="button"
          data-target="dormroom.html"
          data-new-tab="true"
          data-go-label="Go to the room"
          data-title="Dorm room Fall 2025-Spring 2026"
          data-desc="This will open up a new tab, leading to the 3D dorm room tour using the joystick and rotating pad control. Rotating devices for a better experience."
        >
          <img src="broom-unity.png" alt="Unity Bedroom View" />
        </button>
      </section>
    </main>

    <div id="linkModal" class="modal" aria-hidden="true">
      <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <h2 id="modalTitle"></h2>
        <p id="modalDesc"></p>
        <div class="modal-actions">
          <button id="cancelBtn" type="button">Umm..not now?</button>
          <button id="goBtn" type="button">Go to the room</button>
        </div>
      </div>
    </div>

    <script src="bedroom.js"></script>
  </body>
</html>
