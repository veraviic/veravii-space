<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bedroom</title>
    <link rel="stylesheet" href="bedroom.css" />
  </head>
  <body>
    <main class="links">
      <section class="panel">
        <button
          class="panel-btn"
          type="button"
          data-target="archive.html"
          data-title="Archive Page"
          data-desc="This opens the archive space with collected objects, writings, and reflections over time."
        >
          <img src="broom-archive.jpeg" alt="Archive Bedroom View" />
        </button>
      </section>
      <section class="panel panel--unity">
        <button
          class="panel-btn"
          type="button"
          data-target="dormroom.html"
          data-new-tab="true"
          data-title="Unity Room"
          data-desc="This opens the interactive Unity room experience where you can explore the 3D scene."
        >
          <img src="broom-unity.png" alt="Unity Bedroom View" />
        </button>
      </section>
    </main>

    <div id="linkModal" class="modal" aria-hidden="true">
      <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <h2 id="modalTitle"></h2>
        <p id="modalDesc"></p>
        <div class="modal-actions">
          <button id="cancelBtn" type="button">Not yet</button>
          <button id="goBtn" type="button">Go to site</button>
        </div>
      </div>
    </div>

    <script src="bedroom.js"></script>
  </body>
</html>
