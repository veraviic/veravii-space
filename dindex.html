<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=800, height=600, initial-scale=1.0,user-scalable=no" />
    <link rel="stylesheet" href="https://unpkg.com/pixeloperator-font/css/pixeloperator.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Indie+Flower&family=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="main.css" />
  </head>

  <body>
    <!-- Centered desktop layout -->
    <div id="desktop">
      <div id="desktop-content">
        <div class="desktop-icons">
          <div class="icon-wrapper" id="decorate-icon">
            <button class="icon-button">
              <img src="icon_album.png" class="icon" />
            </button>
            <div class="icon-label" data-tip="最后都会遗失的物品和记忆">我的照片</div>
          </div>

          <div class="icon-wrapper" id="decorate-icon">
            <button class="icon-button">
              <img src="icon_decorate.png" class="icon" />
            </button>
            <div class="icon-label">装饰房间2005</div>
          </div>

          <div class="icon-wrapper icon-disabled" id="webc-icon" aria-disabled="true">
            <button
              class="icon-button"
              type="button"
              disabled
              aria-label="连接到:我的手机 (不可用)"
            >
              <img src="icon_webc.png" class="icon" />
            </button>
            <div class="icon-label explain" data-tip="连接需要扫描实体二维码">连接到:我的手机</div>
          </div>
        </div>

        <!-- Right bottom icon -->
        <div class="desktop-icons-right">
          <div class="icon-wrapper icon-disabled" id="trash-icon">
            <button class="icon-button" type="button" disabled aria-label="回收站">
              <img src="icon-trash.png" class="icon" />
            </button>
            <div class="icon-label">回收站</div>
          </div>
        </div>
      </div>
    </div>

    <!-- bottom menu bar -->
    <div id="xp-taskbar">
      <img id="xp-start" src="taskbar_menu.png" />
      <div id="xp-middle"></div>
      <div id="xp-clock"></div>
    </div>

    <!-- Start Menu Modal -->
    <div id="startMenuOverlay" style="display: none">
      <div style="position: relative; display: flex; align-items: flex-end">
        <img id="startMenuImg" src="" alt="Start Menu" draggable="false" />
        <!-- Profile pic frame with webcam
        <div
          style="
            position: absolute;
            top: 2.5%;
            left: 7%;
            width: 13%;
            aspect-ratio: 1;
            border: 1px solid #888;
            border-radius: 2px;
            z-index: 20001;
            overflow: hidden;
          "
        >
          <video
            id="menu-webcam"
            autoplay
            muted
            style="
              width: 100%;
              height: 100%;
              object-fit: cover;
              object-position: center 30%;
              filter: blur(0.5px) contrast(1.2);
              image-rendering: pixelated;
              transform: scale(2);
            "
          ></video>
        </div>
        -->
      </div>
    </div>

    <!--draggable notebook -->
    <div class="window" id="custom-window">
      <img src="win_top.png" class="win-top" draggable="false" />
      <img src="win_body.png" class="win-body" />

      <!-- prettier-ignore -->
      <div class="content-area">
        <div class="note-paper" contenteditable="true">☺️ 这是来自2005年的你好,<br/>我现在住在新民四条,我很爱我的家和我的房间,你呢?
        </div>
      </div>

      <div class="resize-handle"></div>
    </div>

    <!-- draggable sticker window -->
    <div class="window" id="gif-window">
      <img src="win_top_blue.png" class="win-top" draggable="false" />

      <div class="side-tabs">
        <div class="tab active"><span class="tab-icon">📌</span></div>
        <div class="tab"><span class="tab-icon">⭐</span></div>
      </div>

      <div class="gif-content tab-panel" id="tab1">
        <img src="sticker1.png" class="gif-image" />
      </div>

      <div class="gif-content tab-panel" id="tab2">
        <img src="sticker2.png" class="gif-image" />
      </div>

      <!-- only one resize handle -->
      <div class="resize-handle"></div>
    </div>

    <!-- photo/archive window - Windows XP File Explorer style -->
    <div class="window" id="photo-window" style="display: none">
      <img src="win_top_blue.png" class="win-top" draggable="false" />
      <button class="win-close" type="button" aria-label="Close window"></button>
      <img src="win_body.png" class="win-body" />

      <div class="content-area">
        <!-- Menu bar -->
        <div class="explorer-menubar">
          <div class="menu-item">文件</div>
          <div class="menu-item">编辑</div>
          <div class="menu-item">查看</div>
          <div class="menu-item">收藏夹</div>
          <div class="menu-item">工具</div>
          <div class="menu-item">帮助</div>
        </div>

        <div class="explorer-layout">
          <!-- Left sidebar with categories - HIDDEN -->
          <div class="explorer-sidebar" style="display: none">
            <div class="sidebar-title">我的照片</div>
            <div class="sidebar-item">全部照片</div>
            <div class="sidebar-section-title">按日期</div>
            <div class="sidebar-item">今天</div>
            <div class="sidebar-item">本周</div>
            <div class="sidebar-item">本月</div>
          </div>

          <!-- Left content area with gallery view -->
          <div class="explorer-content gallery-view">
            <div class="gallery-main-wrapper">
              <!-- Left section: preview and thumbnails -->
              <div class="gallery-left-section">
                <!-- Large preview at top -->
                <div class="gallery-preview">
                  <img id="preview-image" src="" alt="Preview" />
                </div>

                <!-- Navigation buttons -->
                <div class="gallery-nav">
                  <button id="nav-prev" class="nav-btn" aria-label="Previous">
                    <span>◀</span>
                  </button>
                  <button id="nav-next" class="nav-btn" aria-label="Next">
                    <span>▶</span>
                  </button>
                </div>

                <!-- Thumbnail strip at bottom -->
                <div class="gallery-thumbnails">
                  <div class="thumbnail-item" data-src="">
                    <img src="" alt="Thumbnail" />
                  </div>
                </div>
              </div>

              <!-- Right section: description panel -->
              <div class="gallery-description-panel gallery-description-panel-right">
                <div class="description-content">
                  <div class="desc-item">
                    <span class="desc-label">名称:</span>
                    <span class="desc-value" id="desc-name">-</span>
                  </div>
                  <div class="desc-item">
                    <span class="desc-label">大小:</span>
                    <span class="desc-value" id="desc-size">-</span>
                  </div>
                  <div class="desc-item">
                    <span class="desc-label">类型:</span>
                    <span class="desc-value" id="desc-type">-</span>
                  </div>
                  <div class="desc-item">
                    <span class="desc-label">日期:</span>
                    <span class="desc-value" id="desc-date">-</span>
                  </div>
                </div>

                <div
                  class="description-header"
                  style="margin-top: 16px; border-top: 1px solid #c0c0c0; padding-top: 8px"
                >
                  详情
                </div>
                <div class="description-content">
                  <textarea
                    id="desc-custom-notes"
                    class="desc-custom-textarea"
                    placeholder="Add your own notes about this item..."
                  ></textarea>
                </div>
              </div>
            </div>

            <!-- XP-style scrollbar -->
            <div class="gallery-scrollbar">
              <button class="scrollbar-btn scrollbar-left" aria-label="Scroll left">◀</button>
              <div class="scrollbar-track">
                <div class="scrollbar-thumb" id="scrollbar-thumb"></div>
              </div>
              <button class="scrollbar-btn scrollbar-right" aria-label="Scroll right">▶</button>
            </div>
          </div>
        </div>
      </div>

      <!-- overlay to capture resize events above the content -->
      <div class="resize-overlay" aria-hidden="true"></div>
      <div class="resize-handle"></div>
    </div>

    <!-- decorate window (loads webroom.html inside an iframe) -->
    <div class="window" id="decorate-window" style="display: none">
      <img src="win_top_blue.png" class="win-top" draggable="false" />
      <button class="win-close" type="button" aria-label="Close window"></button>
      <img src="win_body.png" class="win-body" />

      <div class="content-area">
        <iframe
          id="decorate-iframe"
          src=""
          frameborder="0"
          style="width: 100%; height: 100%"
        ></iframe>
      </div>

      <!-- overlay to capture resize events above the iframe -->
      <div class="resize-overlay" aria-hidden="true"></div>
      <div class="resize-handle"></div>
    </div>

    <!-- connect/login window (opens from 连接到:我的手机 icon) -->
    <div class="window" id="webc-window" style="display: none">
      <img src="win_top_blue.png" class="win-top" draggable="false" />
      <button class="win-close" type="button" aria-label="Close window"></button>
      <img src="win_body.png" class="win-body" />

      <div class="content-area">
        <div class="webc-panel" role="form" aria-label="Connect login">
          <div class="webc-hero" aria-hidden="true"></div>

          <div class="webc-form">
            <label class="webc-row">
              <span class="webc-label">用户名 (U):</span>
              <input
                id="webc-username"
                class="webc-input"
                type="text"
                value="Veravii9511"
                autocomplete="username"
              />
            </label>

            <label class="webc-row webc-password-row">
              <span class="webc-label">密码 (P):</span>
              <div class="webc-password-container">
                <input
                  id="webc-password"
                  class="webc-input"
                  type="password"
                  value=""
                  placeholder="(请输入密码)(提示词:编织书/封面数字)"
                  autocomplete="current-password"
                />
                <button
                  id="webc-toggle-password"
                  class="webc-eye-btn"
                  type="button"
                  aria-label="Show password"
                >
                  😖
                </button>
              </div>
            </label>

            <div class="webc-sep" aria-hidden="true"></div>

            <div class="webc-save">
              <label class="webc-check">
                <input id="webc-save" type="checkbox" checked />
                为下面用户保存用户名和密码 (S):
              </label>
              <div class="webc-radio-group" role="radiogroup" aria-label="保存范围">
                <label class="webc-radio">
                  <input type="radio" name="webc-scope" value="me" checked />
                  只是我 (I)
                </label>
                <label class="webc-radio">
                  <input type="radio" name="webc-scope" value="anyone" />
                  任何使用此计算机的人 (A)
                </label>
              </div>
            </div>
          </div>

          <div class="webc-footer">
            <div class="webc-sep" aria-hidden="true"></div>
            <div class="webc-actions">
              <button id="webc-connect" class="webc-btn" type="button">连接 (C)</button>
              <button id="webc-cancel" class="webc-btn secondary" type="button">取消</button>
            </div>
          </div>
        </div>
      </div>

      <div class="resize-handle"></div>
    </div>

    <!--
    <div id="spotlight"></div>
    -->

    <script src="main.js"></script>
  </body>
</html>
