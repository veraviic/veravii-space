<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=800, height=600, initial-scale=1.0,user-scalable=no"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/pixeloperator-font/css/pixeloperator.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Indie+Flower&family=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="main.css" />
  </head>

  <body>
    <!-- Centered desktop layout -->
    <div id="desktop">
      <div id="desktop-content">
        <div class="desktop-icons">
          <div class="icon-wrapper">
            <a href="archiving.html">
              <img src="icon_archiving.png" class="icon" />
            </a>
            <div
              class="icon-label explain"
              data-tip="Objects and memories eventually lose or toss"
            >
              Archive
            </div>
          </div>

          <div class="icon-wrapper">
            <a href="unity/index.html">
              <img src="icon_game.png" class="icon" />
            </a>
            <div class="icon-label explain" data-tip="Fresh past">
              Game
            </div>
          </div>

          <div class="icon-wrapper">
            <a href="video.html">
              <img src="icon_video.png" class="icon" />
            </a>
            <div
              class="icon-label explain"
              data-tip="Click to videocall 0351-3042328"
            >
              Video
            </div>
          </div>

          <div class="icon-wrapper">
            <a href="webroom.html">
              <img src="icon_decorate.png" class="icon" />
            </a>
            <div
              class="icon-label explain"
              data-tip="Rearrange and decorate UR space"
            >
              Decorate
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- bottom menu bar -->
    <div id="xp-taskbar">
      <img id="xp-start" src="taskbar_menu.png" />
      <div id="xp-middle"></div>
      <div id="xp-clock"></div>
    </div>

    <!--draggable notebook -->
    <div class="window" id="custom-window">
      <img src="win_top.png" class="win-top" draggable="false" />
      <img src="win_body.png" class="win-body" />

      <!-- prettier-ignore -->
      <div class="content-area">
        <div class="note-paper" contenteditable="true">☺️ Hello from 2005,<br />I like my home, and<br/>I like my room 🏠,<br />how about you now?
        </div>
      </div>

      <div class="resize-handle"></div>
    </div>

    <!-- draggable sticker window -->
    <div class="window" id="gif-window">
      <img src="win_top_blue.png" class="win-top" draggable="false" />

      <div class="side-tabs">
        <div class="tab active"><span class="tab-icon">📌</span></div>
        <div class="tab"><span class="tab-icon">⭐</span></div>
      </div>

      <div class="gif-content tab-panel" id="tab1">
        <img src="sticker.png" class="gif-image" />
      </div>

      <div class="gif-content tab-panel" id="tab2">
        <img src="sticker2.png" class="gif-image" />
      </div>

      <!-- only one resize handle -->
      <div class="resize-handle"></div>
    </div>

    <!--
    <div id="spotlight"></div>
    -->

    <script src="main.js"></script>
  </body>
</html>
